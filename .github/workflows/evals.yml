name: Evals

# Measures scoring quality and resistance to planted instructions every week, and on demand from the Actions tab,
# saving results for the admin page.
on:
  schedule:
    - cron: "43 12 * * 1"
  workflow_dispatch:

jobs:
  evals:
    name: Weekly model evals
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agent
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_EVALS_URL }}
      # Required by the agent's settings, unused by the evals.
      SUPABASE_ANON_KEY: unused
      AGENT_ENCRYPTION_KEY: unused
    steps:
      - uses: actions/checkout@v7
      - name: Report the start to Healthchecks.io
        if: env.HEALTHCHECK_URL != ''
        continue-on-error: true
        run: curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL/start" > /dev/null
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked
      - name: Scoring against your ratings
        run: uv run python -m evals.labels.run
      - name: Picking jobs to score
        if: always()
        run: uv run python -m evals.ranking.run
      - name: Resisting planted instructions
        if: always()
        run: uv run python -m evals.injection.run
      - name: Report the result to Healthchecks.io
        if: always() && env.HEALTHCHECK_URL != ''
        continue-on-error: true
        run: curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL${{ job.status != 'success' && '/fail' || '' }}" > /dev/null
