name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agent:
    name: Agent lint, types, tests and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agent
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pyright app scripts evals tests
      - run: uv run pytest
      - name: Audit dependencies for known vulnerabilities
        run: uv export --frozen --no-dev --no-hashes > "$RUNNER_TEMP/requirements.txt" && uvx pip-audit -r "$RUNNER_TEMP/requirements.txt"

  web:
    name: Web lint, types, tests, build and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx turbo run lint typecheck test
      # Its own step: next build and next typegen both write to .next, so running them together can collide.
      - run: npx turbo run build
      - name: Audit dependencies for high-severity vulnerabilities
        run: npm audit --audit-level=high

  secrets:
    name: Secret scan of git history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan every commit for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner --verbose

  migrations:
    name: Migrations on a fresh database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 3.1.0
      - run: supabase db start --workdir infra
      - run: supabase db reset --workdir infra

  # Applies new migrations to the hosted database once every check passes; Vercel's Deployment Checks hold the
  # production deploy until this job succeeds, so new code goes live after its migrations.
  migrate:
    name: Apply migrations to production
    needs: [agent, web, migrations, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: production-migrations
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      POOLER_HOST: aws-0-us-east-1.pooler.supabase.com
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 3.1.0
      # Connects through the project's connection pooler, which GitHub's runners reach over IPv4.
      - run: |
          password=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')
          supabase db push --workdir infra --remote="postgresql://postgres.$SUPABASE_PROJECT_ID:$password@$POOLER_HOST:5432/postgres" --yes
