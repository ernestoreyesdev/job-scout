name: Board refresh

# Fetches every directory board, saves its jobs and embeds the new ones, then runs the searches users marked to run
# daily, every day and on demand from the Actions tab.
on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

concurrency:
  group: board-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Daily board refresh
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: services/agent
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_REFRESH_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      # Required by the agent's settings, unused by the refresh.
      AGENT_ENCRYPTION_KEY: unused
    steps:
      - uses: actions/checkout@v7
      - name: Report the start to Healthchecks.io
        if: env.HEALTHCHECK_URL != ''
        continue-on-error: true
        run: curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL/start" > /dev/null
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --no-dev
      - run: uv run python -m scripts.refresh_boards
      - name: Run the daily searches and email new matches
        continue-on-error: true
        run: uv run python -m scripts.email_matches
      - name: Report the result to Healthchecks.io
        if: always() && env.HEALTHCHECK_URL != ''
        continue-on-error: true
        run: curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL${{ job.status != 'success' && '/fail' || '' }}" > /dev/null
