[project]
name = "job-finder-agent"
version = "0.1.0"
description = "Finds jobs that match a user's resume and scores the fit."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.162.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "langchain-core>=1.7.7",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "python-docx>=1.2.0",
    "resend>=2.53.2",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Broad excepts are deliberate where one failing board, job or call must not end a whole run.
ignore = ["BLE001"]

[tool.ruff.lint.isort]
combine-as-imports = true
split-on-trailing-comma = false
