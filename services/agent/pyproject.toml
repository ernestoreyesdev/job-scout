[project]
name = "job-finder-agent"
version = "0.1.0"
description = "Finds jobs that match a user's resume and scores the fit."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
